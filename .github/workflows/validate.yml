name: Validate Add-on

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate config.yaml
        run: |
          cd google_home
          if [ ! -f "config.yaml" ]; then
            echo "Error: config.yaml not found"
            exit 1
          fi
          echo "✓ config.yaml exists"

      - name: Check required files
        run: |
          cd google_home
          for file in Dockerfile build.yaml DOCS.md CHANGELOG.md README.md; do
            if [ ! -f "$file" ]; then
              echo "Error: $file not found"
              exit 1
            fi
            echo "✓ $file exists"
          done

  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
          pip install -r google_home/requirements.txt

      - name: Check code formatting with Black
        run: |
          black --check google_home/rootfs/app/

      - name: Lint with Ruff
        run: |
          ruff check google_home/rootfs/app/

      - name: Type check with MyPy
        run: |
          mypy --strict google_home/rootfs/app/ || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'google_home'
          severity: 'CRITICAL,HIGH'

  build:
    name: Test Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          cd google_home
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-python:3.12-alpine3.19 \
            -t google-home-api:${{ matrix.arch }} \
            .

      - name: Test Docker image
        run: |
          docker run --rm google-home-api:${{ matrix.arch }} python3 --version
